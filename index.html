<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonka Coin | Geleceğin Dijital Varlığı</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 50px 20px;
        }
        h1 {
            font-size: 3rem;
            color: #f0b90b;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #8b949e;
            line-height: 1.6;
        }
        .button {
            display: inline-block;
            padding: 15px 30px;
            margin-top: 30px;
            background-color: #f0b90b;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }
        .button:hover {
            background-color: #d19d00;
        }
        .features {
            display: flex;
            justify-content: space-around;
            margin-top: 50px;
            flex-wrap: wrap;
        }
        .feature-box {
            background-color: #161b22;
            padding: 20px;
            border-radius: 10px;
            width: 30%;
            margin-bottom: 20px;
            border: 1px solid #30363d;
        }
        @media (max-width: 600px) {
            .feature-box { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Zonka Coin</h1>
        <p>Geleceğin dijital varlığına hoş geldiniz. Zonka, hızlı, güvenli ve merkeziyetsiz bir gelecek için tasarlandı.</p>
        
        <a href="#" class="button">Zonka Satın Al</a>

        <div class="features">
            <div class="feature-box">
                <h3>Hızlı İşlemler</h3>
                <p>Saniyeler içinde transfer.</p>
            </div>
            <div class="feature-box">
                <h3>Güvenli Yapı</h3>
                <p>Akıllı sözleşme altyapısı.</p>
            </div>
            <div class="feature-box">
                <h3>Güçlü Topluluk</h3>
                <p>Geleceği birlikte inşa ediyoruz.</p>
            </div>
        </div>
    </div>
</body>
</html>
